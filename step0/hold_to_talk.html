<!doctype html>
<!-- Step 0 test page: hold the button to record, release to stop; plays back and lets you download/share the clip.
     Open via http://localhost (python3 -m http.server) or any https host: browsers only allow the mic on secure origins. -->
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hold to talk</title>
<style>body{font-family:sans-serif;text-align:center;padding:2em}#b{width:70vw;max-width:320px;aspect-ratio:1;border-radius:50%;border:0;font-size:1.4em;background:#222;color:#fff;touch-action:none;user-select:none}#b.on{background:#c00}</style></head>
<body><button id="b">Hold to talk</button><p id="s"></p><div id="out"></div>
<script>
let rec, chunks=[], t0, n=0; const b=document.getElementById('b'), s=document.getElementById('s'), out=document.getElementById('out');
async function start(e){ e.preventDefault(); if(rec&&rec.state==='recording')return;
  const st=await navigator.mediaDevices.getUserMedia({audio:true}); rec=new MediaRecorder(st); chunks=[];
  rec.ondataavailable=x=>chunks.push(x.data);
  rec.onstop=()=>{ st.getTracks().forEach(t=>t.stop()); const blob=new Blob(chunks,{type:rec.mimeType}); const url=URL.createObjectURL(blob);
    const ms=Date.now()-t0; const a=document.createElement('div'); a.innerHTML=`<audio controls src="${url}"></audio> <a download="take_${n++}.webm" href="${url}">save</a> (${(ms/1000).toFixed(1)} s)`; out.prepend(a);
    s.textContent='Saved. Send it to your agent and time the answer.'; };
  rec.start(); t0=Date.now(); b.classList.add('on'); s.textContent='Recording… release to stop'; }
function stop(e){ e.preventDefault(); if(rec&&rec.state==='recording'){ rec.stop(); b.classList.remove('on'); } }
b.addEventListener('pointerdown',start); ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
</script></body></html>
